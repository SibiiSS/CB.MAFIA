<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4787504381562454" crossorigin="anonymous"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mafia Room</title>
<style>
:root{--bg:#1d1e22;--sf:#282a30;--sf2:#34373f;--tx:#dcdde1;--mu:#9b9da7;--lamp:#a99872;--bad:#b57a7a;--ok:#7f9f8d;--r:12px;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;margin:0 0 .4em;line-height:1.15}
h1{font-size:2.3rem;color:var(--lamp)} h2{font-size:1.6rem}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--sf);border-radius:var(--r);padding:16px;margin:14px 0}
label{display:block;color:var(--mu);font-size:.9rem;margin:12px 0 4px}
input,select{width:100%;padding:13px;border-radius:10px;border:2px solid var(--sf2);background:var(--bg);color:var(--tx);font:inherit}
select option{background:var(--sf);color:var(--tx)}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--lamp);outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:13px 16px;background:var(--lamp);color:#1d1e22;cursor:pointer;width:100%;margin-top:10px}
button.alt{background:var(--sf2);color:var(--tx)} button:disabled{opacity:.45;cursor:not-allowed}
.opt{display:flex;justify-content:space-between;align-items:center;text-align:left;background:var(--sf2);color:var(--tx);margin-top:8px}
.opt.sel{background:var(--lamp);color:#1d1e22}.opt.sel .tag{background:rgba(0,0,0,.18);color:#1d1e22}
.err{color:var(--bad);min-height:1.3em;margin-top:8px}
.mu{color:var(--mu)} .big{font-size:1.7rem;font-family:Georgia,serif;text-align:center;margin:18px 0}
.timer{float:right;font-variant-numeric:tabular-nums;color:var(--lamp);font-weight:700;font-size:1.2rem}
.pl{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--sf2)}
.pl:last-child{border:0} .dead{text-decoration:line-through;color:var(--mu)}
.tag{font-size:.8rem;border-radius:99px;padding:2px 9px;background:var(--bg);margin-left:6px;text-align:right}
.role{font-family:Georgia,serif;font-size:1.5rem;text-align:center;color:var(--lamp);margin:4px 0}
.bad{color:var(--bad)} .ok{color:var(--ok)}
.chat{max-height:200px;overflow-y:auto;margin:8px 0;font-size:.95rem}.chat p{margin:4px 0}.chat b{color:var(--lamp)}
.row{display:flex;gap:8px}.row button{width:auto;margin:0}
summary{cursor:pointer}.h{display:block;padding:8px 0;border-bottom:1px solid var(--sf2)}.h div{font-size:.9rem}
@media(prefers-reduced-motion:no-preference){.fresh .pop{animation:p .3s}@keyframes p{from{opacity:0}}}
</style>
</head>
<body><main id="app"></main>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io(), app = document.getElementById('app');
const urlRoom = new URLSearchParams(location.search).get('room') || '';
let S = null, offset = 0, err = '', form = { name: '', room: urlRoom.toUpperCase() }, mode = urlRoom ? 'join' : 'create';
let last = '', lastKey = '', histOpen = false;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sess = { get: () => { try { return JSON.parse(localStorage.getItem('mafia_sess')); } catch (e) { return null; } },
  set: v => { try { v ? localStorage.setItem('mafia_sess', JSON.stringify(v)) : localStorage.removeItem('mafia_sess'); } catch (e) {} } };
const ROLES = { villager: ['Villager', ''], doctor: ['Doctor', ''], police: ['Police', ''], mafia: ['Mafia', ''] };

socket.on('connect', () => { const s = sess.get(); if (s) socket.emit('resume', s, r => { if (r.error) { sess.set(null); S = null; render(); } }); });
socket.on('state', st => { offset = st.now - Date.now(); S = st; err = ''; render(); });

const left = () => Math.max(0, Math.ceil((S.deadline - (Date.now() + offset)) / 1000));
const fmt = s => s >= 60 ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : s + 's';
const tick = () => { const t = document.getElementById('timer'); if (t && S && S.deadline) t.textContent = fmt(left()); };
setInterval(tick, 250);
const timer = () => S.deadline ? '<span class="timer" id="timer"></span>' : '';
const nm = id => { const p = (S.players || []).find(x => x.id === id); return p ? p.name : ''; };

function home() {
  const sel = (id, arr, unit, d) => `<select id="${id}">${arr.map(v => `<option value="${v}" ${v === d ? 'selected' : ''}>${v} ${unit}</option>`).join('')}</select>`;
  return `<h1>Mafia Room</h1><p class="mu">The site plays narrator. You bring the friends.</p>
  <div class="card"><label for="name">Your name</label><input id="name" maxlength="20" value="${esc(form.name)}" autocomplete="off">
  <label for="room">Room ID</label><input id="room" maxlength="20" value="${esc(form.room)}" autocomplete="off">
  ${mode === 'create' ? `<label for="ns">Night time per round</label>${sel('ns', [20, 30, 40, 50, 60, 90, 120], 'seconds', 20)}
  <label for="vm">Voting time limit</label>${sel('vm', [10, 20, 30, 40, 50, 60], 'minutes', 10)}` : ''}
  <div class="err">${esc(err)}</div>
  <button id="go">${mode === 'create' ? 'Create room' : 'Join room'}</button>
  <button class="alt" id="sw">${mode === 'create' ? 'I have a room ID to join' : 'Create a new room instead'}</button></div>`;
}
function lobby() {
  const link = location.origin + '/?room=' + encodeURIComponent(S.room), n = S.players.length;
  return `<h2>Room ${esc(S.room)}</h2><div class="card"><p class="mu" style="margin-top:0">Invite link</p><div style="word-break:break-all">${esc(link)}</div>
  <button class="alt" id="share" data-link="${esc(link)}">Share or copy invite</button></div>
  <div class="card"><b>Players (${n})</b>${S.players.map(p => `<div class="pl"><span>${esc(p.name)}${p.owner ? '<span class="tag">owner</span>' : ''}${p.id === S.me.id ? '<span class="tag">you</span>' : ''}</span><span class="${p.connected ? 'ok' : 'bad'}">${p.connected ? 'here' : 'away'}</span></div>`).join('')}</div>
  <p class="mu">Night ${S.settings.nightSec}s · Voting up to ${S.settings.voteMin} min</p>
  ${S.me.isOwner ? `<button id="start" ${n < S.minPlayers ? 'disabled' : ''}>${n < S.minPlayers ? `Need ${S.minPlayers - n} more to start` : 'Start game'}</button>` : '<p class="mu">Waiting for the owner to start.</p>'}
  <button class="alt" id="leave">Leave room</button>`;
}
function roleScreen() {
  if (S.me.acked || !S.me.role) return `<div class="card pop"><p class="mu" style="text-align:center;margin:6px 0">Waiting for others… ${timer()}</p></div>`;
  const m = S.mafiaNames;
  return `<div class="card pop" style="padding:10px;font-size:.85rem"><span class="mu">Role ${timer()}</span><div class="role">${ROLES[S.me.role][0]}</div>
  ${m ? `<p class="mu" style="text-align:center;margin:2px 0">Team: ${m.map(esc).join(', ')}</p>` : ''}
  <button id="ack" style="padding:8px;margin-top:6px">Got it</button></div>`;
}
const ptsLine = () => `<p class="mu" style="margin:4px 0">${S.me.role === 'mafia' ? 'Team purse' : 'Your points'}: <b style="color:var(--tx)">${S.pts}</b>${S.gain ? ` (+${S.gain})` : ''}</p>`;
function hist(list) {
  if (!list || !list.length) return '';
  return `<details class="card" id="hist" ${histOpen ? 'open' : ''}><summary><b>History</b></summary>${list.map(l => `<span class="h"><b>Round ${l.round}</b>
  <div class="mu">Night: ${l.died ? esc(l.died) + ' died' : 'No One Dies'}${l.revived ? ' · ' + esc(l.revived) + ' was revived' : ''}</div>
  ${l.votes ? `<div class="mu">Votes: ${l.votes.map(v => esc(v.voter) + ' → ' + esc(v.target)).join(', ')}</div><div class="mu">${l.eliminated ? esc(l.eliminated) + ' is Eliminated' : 'No One is Eliminated'}</div>` : ''}</span>`).join('')}</details>`;
}
function reviveBlock() {
  const rv = S.rv; if (!rv || !rv.opts.length) return '';
  const can = S.pts >= rv.price && rv.left > 0;
  return `<p class="mu" style="margin:16px 0 0">Revive someone who was voted out. Cost ${rv.price}${S.me.role === 'mafia' ? ' from the team purse' : ' points'} · ${rv.left} revive${rv.left === 1 ? '' : 's'} left</p>` +
    rv.opts.map(o => `<button class="opt ${rv.mine === o.id ? 'sel' : ''}" data-r="${o.id}" ${can || rv.mine === o.id ? '' : 'disabled'}>${esc(o.name)}</button>`).join('');
}
function targets(list, skip) {
  return list.map(p => `<button class="opt ${S.pick === p.id ? 'sel' : ''}" data-t="${p.id}">${esc(p.name)}${p.id === S.me.id ? '<span class="tag">you</span>' : ''}</button>`).join('') +
    (skip ? `<button class="opt ${S.pick === 'skip' ? 'sel' : ''}" data-t="skip">Skip tonight</button>` : '');
}
function night() {
  const r = S.me.role, a = S.players.filter(p => p.alive);
  if (!S.me.alive) return `<div class="card"><h2>Night ${S.round} ${timer()}</h2><p class="mu">You are out. Keep watching in silence.</p></div>${hist(S.history)}`;
  const cfg = { mafia: ['Choose tonight’s victim', a.filter(p => !(S.mafiaNames || []).includes(p.name)), true], doctor: ['Choose who to save', a, false],
    police: ['Choose who to investigate', a.filter(p => p.id !== S.me.id), false], villager: ['Who do you suspect is Mafia? Picking someone earns points.', a.filter(p => p.id !== S.me.id), false] }[r];
  const mates = S.mates && S.mates.length > 1 ? `<p class="mu">Team picks: ${S.mates.map(m => `${esc(m.name)} → ${m.pick ? (m.pick === 'skip' ? 'skip' : esc(nm(m.pick))) : '…'}`).join(', ')}<br>You must all pick the same person, or no one dies.</p>` : '';
  return `<div class="card pop"><h2>Eyes closed. ${timer()}</h2>${ptsLine()}<p class="mu" style="margin:6px 0 0">${cfg[0]}</p>${mates}${targets(cfg[1], cfg[2])}${reviveBlock()}</div>${hist(S.history)}`;
}
function roster() { return `<div class="card">${S.players.map(p => `<div class="pl ${p.alive ? '' : 'dead'}"><span>${esc(p.name)}</span><span class="mu">${p.alive ? '' : 'out'}</span></div>`).join('')}</div>`; }
function morning() {
  const i = S.investigation;
  return `<div class="card pop"><span class="mu">Morning ${timer()}</span><div class="big ${S.died ? 'bad' : 'ok'}">${S.died ? esc(S.died) + ' died' : 'No One Dies'}</div>
  ${S.revived ? `<p style="text-align:center" class="ok">${esc(S.revived)} was revived</p>` : ''}
  ${i ? `<p style="text-align:center">Your investigation: <b>${esc(i.name)}</b> is <b class="${i.mafia ? 'bad' : 'ok'}">${i.mafia ? 'Mafia' : 'not Mafia'}</b></p>` : ''}
  ${S.me.alive ? ptsLine() : ''}<p class="mu" style="text-align:center">Discuss. Voting opens when the timer ends.</p></div>${roster()}${hist(S.history)}`;
}
function votes() {
  const a = S.players.filter(p => p.alive), v = S.votes || {}, mine = v[S.me.id];
  const who = id => a.filter(p => v[p.id] === id).map(p => esc(p.name)).join(', ');
  const row = (id, label, self) => `<button class="opt ${mine === id ? 'sel' : ''}" ${self ? '' : `data-v="${id}"`} ${S.me.alive && !self ? '' : 'disabled'}><span>${label}${self ? '<span class="tag">you</span>' : ''}</span><span class="tag">${who(id) || '0'}</span></button>`;
  const waiting = a.filter(p => !v[p.id]).map(p => esc(p.name)).join(', ');
  return `<div class="card pop"><h2>Vote ${timer()}</h2>${S.me.alive ? '<p class="mu" style="margin:0">Tap a name or skip. You can change your vote.</p>' : '<p class="mu">You are out. Watching only.</p>'}
  ${a.map(p => row(p.id, esc(p.name), p.id === S.me.id)).join('')}${row('skip', 'Skip')}
  ${waiting ? `<p class="mu">Waiting for: ${waiting}</p>` : ''}</div>${hist(S.history)}`;
}
function voteResult() {
  return `<div class="card pop"><div class="big ${S.eliminated ? 'bad' : 'ok'}">${S.eliminated ? esc(S.eliminated) + ' is Eliminated' : 'No One is Eliminated'}</div><p class="mu" style="text-align:center">Night falls soon…</p></div>${roster()}${hist(S.history)}`;
}
function gameover() {
  const f = S.final; if (!f) return '';
  return `<div class="card pop"><div class="big ${f.winner === 'Mafia' ? 'bad' : 'ok'}">${f.winner} win</div></div>
  <div class="card"><b>Roles</b>${f.players.map(p => `<div class="pl ${p.alive ? '' : 'dead'}"><span>${esc(p.name)}</span><span>${ROLES[p.role][0]}</span></div>`).join('')}</div>
  <div class="card"><b>Game history</b>${f.log.map(l => `<span class="h"><b>Round ${l.round}</b>
  <div class="mu">Night: ${l.died ? esc(l.died) + ' died' : 'No One Dies'}${l.revived ? ' · ' + esc(l.revived) + ' was revived' : ''}</div>
  ${l.votes ? `<div class="mu">Votes: ${l.votes.map(v => esc(v.voter) + ' → ' + esc(v.target)).join(', ')}</div><div class="mu">${l.eliminated ? esc(l.eliminated) + ' is Eliminated' : 'No One is Eliminated'}</div>` : ''}</span>`).join('')}</div>
  <button id="again">Play again</button><button class="alt" id="leave">Leave room</button>`;
}
function chatPanel() {
  return `<div class="card"><b>Dead chat</b> <span class="mu">(only out players see this)</span><div class="chat" id="chatbox">${(S.chat || []).map(m => `<p><b>${esc(m.name)}:</b> ${esc(m.text)}</p>`).join('') || '<p class="mu">No messages yet.</p>'}</div>
  <div class="row"><input id="ci" maxlength="200" placeholder="Message" autocomplete="off"><button id="cs">Send</button></div></div>`;
}
function render() {
  const ci = document.getElementById('ci'), keep = ci && { v: ci.value, f: document.activeElement === ci }, sy = window.scrollY;
  let h = !S ? home() : ({ lobby, role: roleScreen, night, morning, vote: votes, voteResult, gameover }[S.phase] || (() => ''))();
  if (S && S.chat) h += chatPanel();
  const key = S ? S.phase + ':' + S.round : 'home';
  app.classList.toggle('fresh', key !== lastKey); lastKey = key;
  if (h !== last) {
    app.innerHTML = h; last = h;
    const nc = document.getElementById('ci'); if (nc && keep) { nc.value = keep.v; if (keep.f) nc.focus(); }
    const cb = document.getElementById('chatbox'); if (cb) cb.scrollTop = cb.scrollHeight;
    window.scrollTo(0, sy);
  }
  tick();
}
app.addEventListener('toggle', e => { if (e.target.id === 'hist') histOpen = e.target.open; }, true);
app.addEventListener('input', e => { if (e.target.id === 'name') form.name = e.target.value; if (e.target.id === 'room') form.room = e.target.value; });
app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'ci') document.getElementById('cs').click(); });
app.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'sw') { mode = mode === 'create' ? 'join' : 'create'; err = ''; last = ''; render(); }
  else if (b.id === 'go') {
    const extra = mode === 'create' ? { nightSec: +document.getElementById('ns').value, voteMin: +document.getElementById('vm').value } : {};
    socket.emit(mode === 'create' ? 'create' : 'join', { name: form.name, room: form.room, ...extra }, r => {
      if (r.error) { err = r.error; last = ''; render(); return; }
      sess.set({ room: r.room, token: r.token });
    });
  }
  else if (b.id === 'start') socket.emit('start');
  else if (b.id === 'ack') socket.emit('ack');
  else if (b.id === 'again') socket.emit('again');
  else if (b.id === 'leave') { socket.emit('leave'); sess.set(null); S = null; mode = 'create'; last = ''; history.replaceState(null, '', '/'); render(); }
  else if (b.id === 'share') {
    const l = b.dataset.link;
    if (navigator.share) navigator.share({ title: 'Join my Mafia game', url: l }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(l).then(() => (b.textContent = 'Link copied'));
  }
  else if (b.id === 'cs') { const i = document.getElementById('ci'); if (i.value.trim()) { socket.emit('chat', i.value); i.value = ''; } }
  else if (b.dataset.t) socket.emit('night', b.dataset.t);
  else if (b.dataset.r) socket.emit('revive', S.rv && S.rv.mine === b.dataset.r ? null : b.dataset.r);
  else if (b.dataset.v) socket.emit('vote', b.dataset.v);
});
render();
</script>
</body></html>
